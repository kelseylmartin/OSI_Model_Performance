# Pkgdown configuration for the Optics package

url: https://NOAA-NMFS-SWFSC.github.io/Optics
title: "Optics Package Guide"

template:
  bootstrap: 5
  bootswatch: cerulean
  includes:
    in_header: |
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />


navbar:
  structure:
    left:  [home, reference]
    right: [search, github]
  components:
    home:
      text: "Welcome"
      href: index.html
    reference:
      text: "Functions"
      href: reference/index.html

    github:
      icon: fab fa-github fa-lg
      href: https://github.com/NOAA-NMFS-SWFSC/Optics
      aria-label: "GitHub"

reference:
  - title: "Data Ingestion & Representation"
    desc:  "Functions for reading data from various sources and the main S4 class."
    contents:
      - OpticsDetections-class
      - OpticsDetections
      - convert_track_csv_to_kwcoco
      - read_kwcoco
      - read_viame_csv
      - read_wide_maxn
      - scrape_gcp_uris

  - title: "Alignment & Transformation"
    desc:  "Functions for aligning model and ground truth data."
    contents:
      - align_counts
      - classify_detections

  - title: "Ecological Metrics"
    desc:  "Functions for calculating standard ecological metrics like MaxN."
    contents:
      - calculate_maxn
      - calculate_frame_abundance
      - calculate_density

  - title: "Performance Evaluation"
    desc:  "Functions for assessing model performance."
    contents:
      - calculate_legacy_metrics
      - calculate_scalpred_metrics
      - calculate_percent_metric
      - summarize_performance_by_threshold
      - calculate_binary_metrics
      - calculate_confusion_matrix
      - get_disagreement_report
      - analyze_reviewer_effort
      - analyze_performance_drivers

  - title: "Dataset-Specific Helpers"
    desc: "Workflow helpers for Ice Seal data ingestion and review preparation."
    contents:
      - ingest_ice_seals_csv
      - calculate_ice_seals_totals
      - select_ice_seals_candidates

  - title: "Visualizations"
    desc:  "Functions for plotting and visualizing results."
    contents:
      - plot_counts_scatterplot
      - plot_bland_altman
      - plot_pr_curve
      - plot_roc_curve
      - plot_scalpred_f1_curve
      - plot_scalpred_pr_curve
      - plot_confusion_matrix
      - plot_multiclass_confusion_matrix
      - plot_performance_by_threshold

  - title: "Plot Theming"
    desc: "Custom `ggplot2` theme for consistent branding."
    contents:
      - theme_optics

  - title: "Utilities"
    desc: "Other exported operators and utilities."
    contents:
      - '%>%'
